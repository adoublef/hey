[package]
name = "hey"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
async-stream = "0.3.6"
async_zip = { version = "0.0.18", features = ["chrono", "deflate", "tokio"] }
axum = { version = "0.8.9", features = [] }
bytes = "1.11.1"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive", "std"] }
csv-async = { version = "1.3.1", features = ["tokio"] }
derive_more = { version = "2.1.1", features = ["std", "from", "error", "display", "from", "into"]}
futures = "0.3.32"
futures-util = "0.3.32"
html5gum = "0.8.3"
http = { version = "1.4.0", features = ["std"] }
http-body-util = "0.1.3"
http-json-stream = "0.1.2"
maud = { version = "0.27.0", features = ["axum"] }
mime = "0.3.17"
mimetype-detector = "0.3.8"
reqwest = { version = "0.13.3", features = ["stream"] }
serde = { version = "1.0.228", features = ["derive"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.52.1", features = ["rt-multi-thread", "signal", "sync"] }
tokio-stream = "0.1.18"
tokio-util = { version = "0.7.18", features = ["io", "io-util", "time"] }
tower-http = { version = "0.6.8", features = ["fs"] }
url = { version = "2.5.8", features = ["serde"] }
